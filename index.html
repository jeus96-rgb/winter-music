<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>겨울 산책 플레이리스트</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--tx:#25282b;--sub:#6c7075;--ac:#4d6fa5;--bd:#0000001a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232830;--card:#ffffff12;--tx:#f0f0f0;--sub:#a8abb0;--ac:#8fb0e0;--bd:#ffffff22}}
:root[data-theme="dark"]{--bg:#232830;--card:#ffffff12;--tx:#f0f0f0;--sub:#a8abb0;--ac:#8fb0e0;--bd:#ffffff22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:24px;margin:6px 0 2px}
.s{color:var(--sub);font-size:14px;margin:0 0 14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.clock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.now{font-size:13px;color:var(--sub)}
.now b{display:block;font-size:18px;color:var(--tx)}
.row{display:flex;gap:8px;margin-top:12px}
button,a.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;text-align:center;text-decoration:none;cursor:pointer;font-family:inherit}
.main{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
a.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:8px;text-decoration:none;color:var(--tx)}
a.item.cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.n{width:22px;text-align:right;color:var(--sub);font-size:13px}
.t{flex:1;min-width:0}.t b{display:block;font-size:16px}.t span{font-size:13px;color:var(--sub)}
.m{font-size:13px;color:var(--sub)}.p{color:var(--ac);font-size:20px}
.note{font-size:13px;color:var(--sub);margin-top:18px}
</style></head><body><main>
<h1>❄️ 겨울 산책</h1>
<p class="s">약 60분 코스 · 곡을 누르면 유튜브가 열립니다</p>
<div class="box">
<div class="clock" id="clk">00:00</div>
<div class="bar"><i id="bar"></i></div>
<div class="now">지금 들을 곡<b id="nowt">산책 시작을 눌러 주세요</b><span id="nowa"></span></div>
<div class="row"><button class="main" id="go">▶ 산책 시작</button><a class="btn" id="open" target="_blank" rel="noopener" style="display:none">곡 열기</a></div>
<div class="row"><button id="nx">다음 곡 ⏭</button><button id="rs">처음으로</button></div>
</div>
<div id="list"></div>
<p class="note">시간은 곡마다 대략적인 길이라 실제 영상과 조금 다를 수 있어요. 어두워진 뒤나 길이 미끄러운 날에는 이어폰 볼륨을 낮춰 주변 소리를 듣고, 걸을 땐 화면 대신 앞을 보세요. 홈 화면에 추가하면 앱처럼 열 수 있습니다.</p>
</main><script>
var S=[["사계 '겨울' 2악장", "비발디", 3], ["Waltz of the Snowflakes", "차이콥스키", 7], ["사계 '겨울' 1악장", "비발디", 4], ["Nuvole Bianche", "Ludovico Einaudi", 6], ["Let It Snow", "Dean Martin", 2], ["White Christmas", "Bing Crosby", 3], ["The Christmas Song", "Nat King Cole", 3], ["Have Yourself a Merry Little Christmas", "Frank Sinatra", 3], ["눈의 꽃", "박효신", 5], ["Winter Song", "Sara Bareilles & Ingrid Michaelson", 4], ["River", "Joni Mitchell", 4], ["White Winter Hymnal", "Fleet Foxes", 3], ["Gabriel's Oboe", "Ennio Morricone", 3], ["Jesu, Joy of Man's Desiring", "바흐", 3], ["Canon in D", "파헬벨", 5], ["Winter Wonderland", "Tony Bennett", 2]],run=false,t0=0,off=0,tm,starts=[],tot=0;
S.forEach(function(s){starts.push(tot);tot+=s[2]*60});
var $=function(i){return document.getElementById(i)};
function url(s){return "https://www.youtube.com/results?search_query="+encodeURIComponent(s[1]+" "+s[0])}
function el(){return off+(run?(Date.now()-t0)/1000:0)}
function idx(e){var i=0;for(var j=0;j<S.length;j++)if(e>=starts[j])i=j;return i}
function f(x){x=Math.floor(x);return ("0"+Math.floor(x/60)).slice(-2)+":"+("0"+x%60).slice(-2)}
var items=[];
S.forEach(function(s,i){var a=document.createElement("a");a.className="item";a.target="_blank";a.rel="noopener";a.href=url(s);
a.innerHTML='<span class="n">'+(i+1)+'</span><span class="t"><b></b><span></span></span><span class="m">'+s[2]+'분</span><span class="p">▶</span>';
a.querySelector("b").textContent=s[0];a.querySelector(".t span").textContent=s[1];$("list").appendChild(a);items.push(a)});
function upd(){var e=el(),i=idx(e);$("clk").textContent=f(e)+" / "+f(tot);$("bar").style.width=Math.min(100,e/tot*100)+"%";
items.forEach(function(a,j){a.className="item"+(j===i&&(run||off>0)?" cur":"")});
if(run||off>0){$("nowt").textContent=S[i][0];$("nowa").textContent=S[i][1];$("open").href=url(S[i]);$("open").style.display="";}
if(e>=tot&&run){run=false;off=tot;clearInterval(tm);$("go").textContent="🎉 산책 완료";}}
$("go").onclick=function(){if(run){off=el();run=false;clearInterval(tm);$("go").textContent="▶ 이어서";upd();}else{if(off>=tot)off=0;t0=Date.now();run=true;tm=setInterval(upd,1000);$("go").textContent="⏸ 잠시 멈춤";upd();window.open(url(S[idx(el())]),"_blank");}};
$("nx").onclick=function(){var i=idx(el())+1;if(i>=S.length)return;off=starts[i];t0=Date.now();upd();if(run)window.open(url(S[i]),"_blank");};
$("rs").onclick=function(){run=false;off=0;clearInterval(tm);$("go").textContent="▶ 산책 시작";$("open").style.display="none";$("nowt").textContent="산책 시작을 눌러 주세요";$("nowa").textContent="";upd();};
upd();
</script></body></html>
